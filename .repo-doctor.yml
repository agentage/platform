# repo-doctor config for this repo; schema in agentage/automation scripts/repo-doctor/README.md.
class: node-lib
waive:
  - id: rb-published-files
    reason: 'tag-driven release in feature 1; prepare-release.yml arrives with the release loop (feature 2)'
  - id: ts-published-build
    reason: 'monorepo: tsc -b over packages/extension/tsconfig.json (composite, tests excluded, maps off) is the build config'
  - id: ts-nodenext-ext
    reason: "the only hits are JSON fixtures imported with { type: 'json' }; tsc enforces .js on every .ts import"
  - id: cicd-no-npm-install
    reason: 'the image smoke runs npm install ./.kit/kit.tgz in a throwaway extension-probe clone, so the image carries the packed kit; this repo installs with npm ci'
