name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Conformance (the kit's six rules; the store rule uses the runner's docker)
        run: node_modules/.bin/agentage extension check

  local:
    # The name stays: a required check of the ruleset.
    name: up and the e2e gate on local
    runs-on: ubuntu-latest
    # The gate on docker stays under 10 minutes; slower is a regression.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install (and Chromium for the widget test; the runner has its OS libraries)
        run: |
          npm ci
          npx playwright install chromium

      # The e2e repo is private (the org PAT_TOKEN reads it); Dependabot and fork runs get no secrets.
      - name: Checkout the e2e repo
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Install the e2e repo
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        run: |
          npm ci --prefix e2e-suite --no-audit --no-fund
          npx --prefix e2e-suite playwright install chromium

      # The cli and its kit come from this lockfile: a cli or kit patch needs a commit here.
      - name: agentage extension up --docker (the release recipes, store, dev issuer, gateway)
        run: node_modules/.bin/agentage extension up --docker

      - name: The widget a11y test through the local gateway (src/**/*.spec.ts)
        run: npm run test:e2e

      # {ID}_DIR lets the gate read the contracts from this checkout; the name follows the id.
      - name: e2e gate on docker (the e2e repo, a row in its extensions.json)
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        working-directory: e2e-suite
        run: |
          var="$(jq -r .agentage.id ../package.json | tr a-z- A-Z_)_DIR"
          env "$var=$GITHUB_WORKSPACE" npm run e2e -- template gate docker

      # A gate that skipped itself is not green.
      - name: Assert the gate was not vacuous
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true
        working-directory: e2e-suite
        env:
          MIN_EXECUTED: '25'
        run: node scripts/assert-executed.mjs

      - name: Logs on failure
        if: failure() || cancelled()
        run: docker compose -f .agentage/compose.json logs --no-color --tail 80 || true

  # The one required context: green when every job passed or was skipped.
  ci-required:
    name: ci-required
    needs: [verify, local]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
