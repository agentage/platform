name: Release

# Tag-driven: a v* tag publishes every workspace package whose version is not on npm yet, through
# OIDC trusted publishing (npmjs.com trusted publisher = this file).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag commit must be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::$GITHUB_SHA is not on master"; exit 1; }

      - name: Tag guards (tag = v<version> of a package; a moved tag is refused)
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          ok=false
          for manifest in packages/*/package.json; do
            [ "v$(node -p "require('./${manifest}').version")" = "$GITHUB_REF_NAME" ] && ok=true
          done
          $ok || { echo "::error::$GITHUB_REF_NAME is not v<version> of any workspace package"; exit 1; }
          remote=$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)
          [ -n "$remote" ] || remote=$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}" | cut -f1)
          [ "$remote" = "$GITHUB_SHA" ] || { echo "::error::tag $GITHUB_REF_NAME moved ($remote, run is $GITHUB_SHA)"; exit 1; }
          # A release that exists on a first attempt means the tag was reused; a re-run keeps its commit.
          if [ "$GITHUB_RUN_ATTEMPT" = 1 ] && gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::a release for $GITHUB_REF_NAME already exists: a fix is a new version"; exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      # The Verify job proved this commit; publish runs with --ignore-scripts, so dist is built here.
      - name: Build
        run: npm run build

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version # OIDC needs npm >= 11.5.1

      - name: Publish to npm (skips a version already published)
        run: |
          set -euo pipefail
          release_create() {
            for try in 1 2 3; do
              gh release view "$1" >/dev/null 2>&1 && return 0
              gh release create "$@" && return 0
              [ "$try" = 3 ] || sleep $(( try == 1 ? 10 : 30 ))
            done
            gh release view "$1" >/dev/null
          }
          held=()
          # Dependencies first: logs, the kit, the shell package (apphost depends on it), then the rest.
          first='packages/logs/package.json packages/extension/package.json packages/shell-dashboard/package.json'
          for manifest in $first $(ls packages/*/package.json | grep -vE '^packages/(logs|extension|shell-dashboard)/'); do
            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            if [ "$(node -p "require('./${manifest}').private === true")" = "true" ]; then continue; fi
            # A package whose @agentage dependency is not on npm yet (staged, say) waits for a re-run of this tag run.
            missing=$(node -p "Object.entries(require('./${manifest}').dependencies ?? {}).filter(([d]) => d.startsWith('@agentage/')).map(([d, r]) => d + '@' + r).join(' ')")
            for dep in $missing; do
              if [ -z "$(npm view "$dep" version 2>/dev/null)" ]; then
                held+=("${name}@${version} waits: ${dep} is not on npm yet")
                continue 2
              fi
            done
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm"
              continue
            fi
            # The Verify step already ran: publish without lifecycle scripts (a flaky re-run must not stage).
            if ! npm publish -w "${name}" --access public --provenance --ignore-scripts 2>publish.err; then
              cat publish.err >&2
              # Only an auth refusal (no validated trusted publisher) stages it once for approval.
              if ! grep -qE 'ENEEDAUTH|E401|E403|E404' publish.err; then
                held+=("${name}@${version} publish failed, not staged: see the log")
                continue
              fi
              if npm stage publish -w "${name}" --access public --provenance --ignore-scripts; then
                held+=("${name}@${version} STAGED for approval on npmjs.com, not published")
              # Only a real 404 is a new name; a registry outage or a timeout keeps the line below.
              elif { npm view "${name}" name 2>&1 || true; } | grep -q E404; then
                held+=("${name}@${version} new package name: first publish needs the owner (docs/release.md, \"First publish of a new package name\")")
              else
                held+=("${name}@${version} not published and not staged (already staged? approve it on npmjs.com)")
              fi
              continue
            fi
            echo "published ${name}@${version}" >> "$GITHUB_STEP_SUMMARY"
            # The registry answers a new version some time after the publish; the next package's dependency check reads it.
            for try in $(seq 30); do
              npm view "${name}@${version}" version >/dev/null 2>&1 && break
              [ "$try" -lt 30 ] && sleep 10 || echo "::warning::${name}@${version} is not visible on npm after 5 minutes"
            done
            # The extension kit keeps the pushed v<version> tag; every other package gets <name>@<version>.
            dir=$(dirname "${manifest}")
            if [ "${name}" = "@agentage/extension" ]; then
              tag="v${version}"
              prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$tag" | head -1 || true)
            else
              tag="${name}@${version}"
              prev=$(git tag --list "${name}@*" --sort=-v:refname | head -1 || true)
            fi
            if [ -n "$prev" ]; then range="${prev}..HEAD"; else range="-30"; fi
            notes=$(git log --oneline "$range" -- "$dir")
            # The apphost-image job can create the same release first: "already exists" is fine.
            release_create "$tag" --target "$GITHUB_SHA" --title "${name}@${version}" --notes "${notes:-No changes under ${dir}}"
          done
          # A green run means everything shipped; anything held turns it red with the reason.
          for line in "${held[@]}"; do
            echo "::error::${line}"
            echo "HELD: ${line}" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ${#held[@]} -gt 0 ]; then
            echo "Approve or publish what is held, then re-run this tag run (a dispatch runs master HEAD, not the tag)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # The kit just published is gated by e2e at once; it never fails a release (the input may not exist yet).
      - name: Dispatch the e2e nightly local gate for this kit
        if: github.ref_type == 'tag'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then echo "tag $GITHUB_REF_NAME is not the kit: no dispatch"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::warning::no PAT_TOKEN: e2e not dispatched"; exit 0; fi
          if gh workflow run nightly-local.yml -R agentage/e2e -f "kit=${version}"; then
            echo "dispatched e2e nightly-local.yml kit=${version}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::e2e nightly-local.yml did not accept kit=${version} (no kit input yet, or the token cannot dispatch)"
          fi

  # The program image and its record (agentage-apphost.json) on release @agentage/apphost@<v>.
  # It needs Verify only: an npm publish that is held must not stop the image.
  apphost-image:
    name: App host image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ghcr.io/agentage/platform/apphost
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Skip: the record is on the release, or the version was released at another commit.
      # Build: no image tag. Record: the tags <v> and <commit> name one digest. Refuse: another digest.
      - name: Decide (build, record, skip or refuse)
        id: decide
        run: |
          set -euo pipefail
          node packages/apphost/scripts/image-release.mjs decide | tee -a "$GITHUB_OUTPUT"
          grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | sed 's/^reason=/apphost image: /' >> "$GITHUB_STEP_SUMMARY"

      - name: Build time (the commit time)
        id: time
        if: steps.decide.outputs.action == 'build'
        run: echo "value=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        id: build
        if: steps.decide.outputs.action == 'build'
        with:
          context: .
          file: packages/apphost/Dockerfile
          push: true
          # The commit tag lets a re-run find this push and record it, never build again.
          tags: |
            ${{ env.IMAGE }}:${{ steps.decide.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.time.outputs.value }}
            VERSION=${{ steps.decide.outputs.version }}

      - name: Write the record (the version tag must name the digest)
        if: steps.decide.outputs.action == 'build' || steps.decide.outputs.action == 'record'
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.decide.outputs.digest }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          pushed=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$pushed" = "$DIGEST" ] || { echo "::error::${IMAGE}:${VERSION} is ${pushed}, not ${DIGEST}"; exit 1; }
          node packages/apphost/scripts/image-release.mjs record "$DIGEST" > agentage-apphost.json
          cat agentage-apphost.json

      - name: Create the release when absent, upload the record last
        if: steps.decide.outputs.action == 'build' || steps.decide.outputs.action == 'record'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          tag="@agentage/apphost@${VERSION}"
          prev=$(git tag --list '@agentage/apphost@*' --sort=-v:refname | grep -vx "$tag" | head -1 || true)
          if [ -n "$prev" ]; then range="${prev}..HEAD"; else range="-30"; fi
          notes=$(git log --oneline "$range" -- packages/apphost)
          # The publish job can create the same release first: "already exists" is fine.
          release_create() {
            for try in 1 2 3; do
              gh release view "$1" >/dev/null 2>&1 && return 0
              gh release create "$@" && return 0
              [ "$try" = 3 ] || sleep $(( try == 1 ? 10 : 30 ))
            done
            gh release view "$1" >/dev/null
          }
          release_create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "${notes:-No changes under packages/apphost}"
          gh release upload "$tag" agentage-apphost.json
          echo "record on ${tag}: $(jq -r .image agentage-apphost.json)" >> "$GITHUB_STEP_SUMMARY"
