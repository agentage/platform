name: Release

# Tag-driven: a v* tag publishes every workspace package whose version is not on npm yet, through
# OIDC trusted publishing (npmjs.com trusted publisher = this file).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version # OIDC needs npm >= 11.5.1

      - name: Publish to npm (skips a version already published)
        env:
          # TEMPORARY: stages the first publish of a new name; delete once @agentage/widget is on npm
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            # Single quotes on purpose: npm expands ${NPM_TOKEN} itself, the token never lands on disk
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc
            echo "first-publish token in use" >> "$GITHUB_STEP_SUMMARY"
          fi
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            if [ "$(node -p "require('./${manifest}').private === true")" = "true" ]; then continue; fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm"
              continue
            fi
            if [ -n "${NPM_TOKEN:-}" ] && ! npm view "${name}" name >/dev/null 2>&1; then npm stage publish -w "${name}" --access public --provenance; else npm publish -w "${name}" --access public --provenance; fi
            echo "published ${name}@${version}" >> "$GITHUB_STEP_SUMMARY"
          done
