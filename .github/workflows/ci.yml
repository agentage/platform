name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Every outbound call has its own bound; this one catches a hung runner or registry.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Pack smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          npm pack -w @agentage/extension --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-extension-*.tgz > /tmp/pack/files.txt
          grep -qx 'package/dist/tool/cli.js' /tmp/pack/files.txt
          grep -qx 'package/dist/runtime/main.js' /tmp/pack/files.txt
          grep -qx 'package/schemas/extension-discovery.schema.json' /tmp/pack/files.txt
          grep -qx 'package/dist/store/migrate.js' /tmp/pack/files.txt
          grep -qx 'package/dist/tool/up/dev-issuer.js' /tmp/pack/files.txt
          if grep -q '\.test\.' /tmp/pack/files.txt; then echo 'test files in the tarball'; exit 1; fi
          node packages/extension/dist/tool/cli.js --help

      - name: Pack smoke - widget (bin and harness in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/widget --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-widget-*.tgz > /tmp/pack/widget-files.txt
          grep -qx 'package/dist/bundle/cli.js' /tmp/pack/widget-files.txt
          grep -qx 'package/dist/ds/styles.generated.js' /tmp/pack/widget-files.txt
          grep -qx 'package/harness/harness.html' /tmp/pack/widget-files.txt
          if grep -Eq '\.test\.|test-support|/e2e/' /tmp/pack/widget-files.txt; then echo 'test files in the widget tarball'; exit 1; fi
          node packages/widget/dist/bundle/cli.js --help

      - name: Image smoke - extension-probe on this kit, every part through up
        run: |
          set -euo pipefail
          npm pack --workspaces --pack-destination /tmp/pack >/dev/null
          # A PR runs against the extension-probe branch of the same name when one exists, else master.
          probe=https://github.com/agentage/extension-probe.git
          branch=master
          if [ -n "${GITHUB_HEAD_REF:-}" ] && git ls-remote --exit-code --heads "$probe" "$GITHUB_HEAD_REF" >/dev/null; then
            branch="$GITHUB_HEAD_REF"
          fi
          echo "extension-probe branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          git clone --depth 1 --branch "$branch" "$probe" /tmp/probe
          mkdir -p /tmp/probe/.kit
          cd /tmp/probe
          # The probe's @agentage/* dependencies built here replace the registry copies.
          tarballs=()
          for tgz in /tmp/pack/agentage-*.tgz; do
            name="@agentage/$(basename "$tgz" | sed -E 's/^agentage-(.*)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/\1/')"
            if jq -e --arg n "$name" '(.dependencies // {}) + (.devDependencies // {}) | has($n)' package.json >/dev/null; then
              cp "$tgz" .kit/ && tarballs+=("./.kit/$(basename "$tgz")")
            fi
          done
          npm install --no-audit --no-fund "${tarballs[@]}"
          node node_modules/@agentage/extension/dist/tool/cli.js up

      - name: Image smoke - every part carries this commit, discovery is valid through the gateway
        working-directory: /tmp/probe
        run: |
          set -euo pipefail
          scripts/image-smoke.sh "$GITHUB_SHA"
          curl -sf http://localhost:4280/.well-known/agentage-extension.json > /tmp/discovery.json
          node --input-type=module -e "import { DiscoveryDocumentSchema } from '@agentage/extension'; import { readFileSync } from 'node:fs'; DiscoveryDocumentSchema.parse(JSON.parse(readFileSync('/tmp/discovery.json', 'utf8'))); console.log('PASS discovery valid')"
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Container logs on failure
        if: failure()
        run: docker compose -f /tmp/probe/.agentage/compose.json logs --no-color --tail 80 || true

  widget-screenshots:
    name: Widget screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Harness, echo widget and light and dark screenshots (Chromium)
        run: npm run test:e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: widget-playwright-report
          path: |
            packages/widget/playwright-report
            packages/widget/test-results
          retention-days: 7
