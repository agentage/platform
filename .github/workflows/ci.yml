name: CI

on:
  push:
    branches: [master]
  pull_request:
    # feature/**: a stacked PR (base = another PR's branch) gets CI too.
    branches: [master, 'feature/**']

concurrency:
  # A PR cancels its older run; each master commit keeps its own run (a burst of merges cancels none).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prTitle:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title is a conventional commit with a scope from CLAUDE.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot writes a long title for a group over many directories and cannot shorten it.
          if [ "$AUTHOR" = "dependabot[bot]" ] && [[ $TITLE =~ ^chore\(deps\):\  ]]; then exit 0; fi
          scoped='^(feat|fix|refactor|test|chore|ci|docs|perf|build)\((extension|apphost|logs|widget|identity|shell|app|template|release|ci|docs|deps)\)!?: .{1,60}$'
          bare='^(ci|docs|chore|build): '
          if [ "${#TITLE}" -le 72 ] && { [[ $TITLE =~ $scoped ]] || [[ $TITLE =~ $bare ]]; }; then exit 0; fi
          echo "::error::PR title '$TITLE' breaks the commit title rules in CLAUDE.md (type(scope): text, max 72)"; exit 1

  verify:
    name: Verify
    runs-on: ubuntu-latest
    # Each CI job stays well under 8 minutes (the Docker smokes run in the Image smokes job); slower is a regression.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: A version bump needs a change in that package
        if: github.event_name == 'pull_request'
        run: node scripts/check-bumps.mjs origin/${{ github.base_ref }}

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Pack smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          npm pack -w @agentage/extension --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-extension-*.tgz > /tmp/pack/files.txt
          grep -qx 'package/dist/tool/cli.js' /tmp/pack/files.txt
          grep -qx 'package/dist/runtime/main.js' /tmp/pack/files.txt
          grep -qx 'package/schemas/extension-discovery.schema.json' /tmp/pack/files.txt
          grep -qx 'package/dist/store/migrate.js' /tmp/pack/files.txt
          grep -qx 'package/dist/tool/up/dev-issuer.js' /tmp/pack/files.txt
          grep -qx 'package/dist/logs/index.js' /tmp/pack/files.txt
          grep -qx 'package/dist/core-client/index.js' /tmp/pack/files.txt
          grep -qx 'package/dist/vendor/logs/index.js' /tmp/pack/files.txt
          grep -qx 'package/dist/vendor/app/index.js' /tmp/pack/files.txt
          grep -qx 'package/dist/vendor/app/test-host.js' /tmp/pack/files.txt
          grep -qx 'package/dist/vendor/app/theme.css' /tmp/pack/files.txt
          # J.4.5 row 8: the shell is its own package; the kit carries no copy.
          if grep -q 'dist/shell' /tmp/pack/files.txt; then echo 'a shell copy is in the kit tarball'; exit 1; fi
          if grep -Eq '/e2e/|\.spec\.' /tmp/pack/files.txt; then echo 'shell e2e files in the tarball'; exit 1; fi
          if grep -q '\.test\.' /tmp/pack/files.txt; then echo 'test files in the tarball'; exit 1; fi
          # J.4.3 row 1: the app host program is its own package.
          if grep -q 'dist/host/daemon' /tmp/pack/files.txt; then echo 'the daemon is in the kit tarball'; exit 1; fi
          node packages/extension/dist/tool/cli.js --help
          # The kit carries logs and the app kit inside: a clean install of the tarball alone resolves every entry.
          mkdir -p /tmp/kit-alone && cd /tmp/kit-alone && npm init -y >/dev/null
          npm install --no-audit --no-fund /tmp/pack/agentage-extension-*.tgz express zod react react-dom @agentage/components
          test ! -e node_modules/@agentage/logs
          test ! -e node_modules/@agentage/app
          test ! -e node_modules/@agentage/shell-dashboard
          node --input-type=module -e "const a = await import('@agentage/extension/app'); if (typeof a.useAppHost !== 'function') throw new Error('no useAppHost'); console.log('PASS kit app subpath')"
          # apphost 0.1.0 imports kitShellDir by name and calls it at start: kept, no folder, no throw.
          node --input-type=module -e "const i = await import('@agentage/extension/internal'); if (i.kitShellDir() !== undefined) throw new Error('kitShellDir names a folder'); console.log('PASS kitShellDir kept')"
          node --input-type=module -e "await import('@agentage/extension'); const l = await import('@agentage/extension/logs'); const e = l.parseLine('hello', { extension: 'smoke', part: 'ci' }); l.EventSchema.parse(e); console.log('PASS kit alone', e.kind, l.KINDS.length)"

      - name: Pack smoke - apphost (dist in, tests out, the kit not inside)
        run: |
          set -euo pipefail
          npm pack -w @agentage/apphost --pack-destination /tmp/pack
          npm pack -w @agentage/shell-dashboard --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-apphost-*.tgz > /tmp/pack/apphost-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/apphost-files.txt
          grep -qx 'package/dist/daemon.js' /tmp/pack/apphost-files.txt
          if grep -Eq '\.test\.|test-support' /tmp/pack/apphost-files.txt; then echo 'test files in the apphost tarball'; exit 1; fi
          # The tarballs alone, outside the workspace, as the cli installs them: one kit, the daemon loads,
          # the shell package resolves with its built page (J.4.5 row 1).
          alone=$(mktemp -d)
          cp /tmp/pack/agentage-extension-*.tgz /tmp/pack/agentage-apphost-*.tgz /tmp/pack/agentage-shell-dashboard-*.tgz "$alone"
          cd "$alone" && npm init -y >/dev/null
          npm install --omit=dev --no-audit --no-fund ./agentage-extension-*.tgz ./agentage-shell-dashboard-*.tgz ./agentage-apphost-*.tgz
          test -f node_modules/@agentage/shell-dashboard/dist/index.html
          test "$(find node_modules -path '*/@agentage/extension/package.json' | wc -l)" = 1
          node --input-type=module -e "const a = await import('@agentage/apphost'); if (typeof a.createDaemon !== 'function') throw new Error('no createDaemon'); console.log('PASS apphost', a.DAEMON_PORT)"

      - name: Pack smoke - widget (bin and harness in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/widget --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-widget-*.tgz > /tmp/pack/widget-files.txt
          grep -qx 'package/dist/bundle/cli.js' /tmp/pack/widget-files.txt
          grep -qx 'package/dist/ds/styles.generated.js' /tmp/pack/widget-files.txt
          grep -qx 'package/harness/harness.html' /tmp/pack/widget-files.txt
          if grep -Eq '\.test\.|test-support|/e2e/' /tmp/pack/widget-files.txt; then echo 'test files in the widget tarball'; exit 1; fi
          node packages/widget/dist/bundle/cli.js --help

      - name: Pack smoke - logs (dist in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/logs --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-logs-*.tgz > /tmp/pack/logs-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/logs-files.txt
          if grep -Eq '\.test\.' /tmp/pack/logs-files.txt; then echo 'test files in the logs tarball'; exit 1; fi

      - name: Pack smoke - identity (dist in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/identity --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-identity-*.tgz > /tmp/pack/identity-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/identity-files.txt
          if grep -Eq '\.test\.' /tmp/pack/identity-files.txt; then echo 'test files in the identity tarball'; exit 1; fi

  smokes:
    name: Image smokes
    runs-on: ubuntu-latest
    # The Docker smokes alone, in parallel with Verify; they pack and build the kit themselves.
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The image release.yml pushes, from this tree: healthy, user node, no local flag, drain inside 10 s.
      - name: Image smoke - the app host program image
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/apphost/package.json').version")
          docker build -f packages/apphost/Dockerfile -t apphost:ci \
            --build-arg COMMIT_SHA="$GITHUB_SHA" --build-arg VERSION="$version" .
          node packages/apphost/scripts/image-smoke.mjs apphost:ci

      - name: Image smoke - the probe extension on this kit, every part through up
        env:
          PROBE_REF: ${{ vars.PROBE_REF }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          npm pack --workspaces --pack-destination /tmp/pack >/dev/null
          # A PR runs against the examples branch named as its head (or a non-default base), else
          # the repo variable PROBE_REF (set while a kit change waits on a probe release), else master.
          probe=https://github.com/agentage/examples.git
          branch="${PROBE_REF:-master}"
          # The base counts only when it is another PR's branch: a PR on master falls to the variable.
          base="${GITHUB_BASE_REF:-}"
          if [ "$base" = "${{ github.event.repository.default_branch }}" ]; then base=""; fi
          for ref in "$base" "${GITHUB_HEAD_REF:-}"; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads "$probe" "$ref" >/dev/null; then branch="$ref"; fi
          done
          echo "examples branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          git clone --depth 1 --branch "$branch" "$probe" /tmp/probe
          dir=$(node "$GITHUB_WORKSPACE/scripts/probe-dir.mjs" /tmp/probe)
          echo "PROBE_DIR=$dir" >> "$GITHUB_ENV"
          mkdir -p "$dir/.kit"
          cd "$dir"
          # The probe's @agentage/* dependencies built here replace the registry copies.
          tarballs=()
          for tgz in /tmp/pack/agentage-*.tgz; do
            name="@agentage/$(basename "$tgz" | sed -E 's/^agentage-(.*)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/\1/')"
            if jq -e --arg n "$name" '(.dependencies // {}) + (.devDependencies // {}) | has($n)' package.json >/dev/null; then
              cp "$tgz" .kit/ && tarballs+=("./.kit/$(basename "$tgz")")
            fi
          done
          npm install --no-audit --no-fund "${tarballs[@]}"
          # The smoke proves the runtime, not probe's pin: a kit minor bump must not wait on a probe release.
          pin="^$(jq -r .version node_modules/@agentage/extension/package.json | cut -d. -f1,2)"
          was=$(jq -r .engines.agentage package.json)
          if [ "$was" != "$pin" ]; then echo "::warning::probe pin stale: engines.agentage $was, smoke runs it as $pin"; fi
          jq --arg r "$pin" '.engines.agentage = $r' package.json > /tmp/pkg.json && cp /tmp/pkg.json package.json
          node node_modules/@agentage/extension/dist/tool/cli.js up

      - name: Image smoke - discovery is valid through the gateway, e2e (up already asserted each part's /health commit)
        working-directory: ${{ env.PROBE_DIR }}
        run: |
          set -euo pipefail
          curl -sf http://localhost:4280/.well-known/agentage-extension.json > /tmp/discovery.json
          node --input-type=module -e "import { DiscoveryDocumentSchema } from '@agentage/extension/contracts'; import { readFileSync } from 'node:fs'; DiscoveryDocumentSchema.parse(JSON.parse(readFileSync('/tmp/discovery.json', 'utf8'))); console.log('PASS discovery valid')"
          npx playwright install chromium
          npm run test:e2e

      - name: Image smoke - the kit caller route through the gateway (200 own scopes, 401, 403)
        working-directory: ${{ env.PROBE_DIR }}
        run: |
          set -euo pipefail
          at=http://localhost:4280/api/probe/caller
          read=$(node node_modules/@agentage/extension/dist/tool/cli.js token --scope probe:read | tail -1)
          other=$(node node_modules/@agentage/extension/dist/tool/cli.js token --scope memory:admin | tail -1)
          curl -sf -H "Authorization: Bearer $read" "$at" | jq -e '.success and (.data | keys == ["scopes","sub"]) and .data.scopes == ["probe:read"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$at")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $other" "$at")" = 403
          echo "PASS caller route"

      # The one container (C7): the image builds from this kit, starts healthy and serves the api.
      - name: One container smoke - build --container, run it, the api answers
        working-directory: ${{ env.PROBE_DIR }}
        run: |
          set -euo pipefail
          node node_modules/@agentage/extension/dist/tool/cli.js build --container
          image="ghcr.io/agentage/$(jq -r .agentage.id package.json):$(jq -r .version package.json)"
          docker run -d --name one -p 127.0.0.1:18080:8080 -e AGENTAGE_HOST_AUTH=off "$image"
          trap 'docker logs one 2>&1 | tail -40' ERR
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' one)" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' one | grep -qx healthy
          curl -sf "http://127.0.0.1:18080/api/probe/echo?msg=hi" | grep -q '"msg":"hi"'
          echo "PASS one container $image"

      - name: Container logs on failure
        if: failure()
        run: docker compose -f "$PROBE_DIR/.agentage/compose.json" logs --no-color --tail 80 || true

  widget-screenshots:
    name: Widget screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Harness, echo widget and light and dark screenshots (Chromium)
        run: npm run test:e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: widget-playwright-report
          path: |
            packages/widget/playwright-report
            packages/widget/test-results
          retention-days: 7

      # One job for both suites: one container start, one install and one build.
      - name: Frame beside the prototype at 1280 and 400 px, axe, CLS, keys (Chromium)
        if: ${{ !cancelled() }}
        run: npm run test:e2e -w @agentage/shell-dashboard

      - name: Screenshots and pixel difference
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shell-screenshots
          path: |
            packages/shell-dashboard/shots
            packages/shell-dashboard/playwright-report
            packages/shell-dashboard/test-results
          retention-days: 7

  probe-local-gate:
    name: Probe local gate on this kit
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: platform

      # The same probe branch as the image smoke: head, a non-default base, vars.PROBE_REF, master.
      - name: Pick the examples branch
        id: probe-ref
        env:
          PROBE_REF: ${{ vars.PROBE_REF }}
        run: |
          branch="${PROBE_REF:-master}"
          probe=https://github.com/agentage/examples.git
          # The base counts only when it is another PR's branch: a PR on master falls to the variable.
          base="${GITHUB_BASE_REF:-}"
          if [ "$base" = "${{ github.event.repository.default_branch }}" ]; then base=""; fi
          for ref in "$base" "${GITHUB_HEAD_REF:-}"; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads "$probe" "$ref" >/dev/null; then branch="$ref"; fi
          done
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The same rule for the e2e repo: head, a non-default base, vars.E2E_REF, master.
      - name: Pick the e2e repo branch
        id: e2e-ref
        if: github.actor != 'dependabot[bot]'
        env:
          E2E_REF: ${{ vars.E2E_REF }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          branch="${E2E_REF:-master}"
          # The base counts only when it is another PR's branch: a PR on master falls to the variable.
          base="${GITHUB_BASE_REF:-}"
          if [ "$base" = "${{ github.event.repository.default_branch }}" ]; then base=""; fi
          for ref in "$base" "${GITHUB_HEAD_REF:-}"; do
            if [ -n "$ref" ] && gh api "repos/agentage/e2e/branches/$ref" --silent 2>/dev/null; then branch="$ref"; fi
          done
          echo "e2e branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout agentage/examples
        uses: actions/checkout@v7
        with:
          repository: agentage/examples
          ref: ${{ steps.probe-ref.outputs.branch }}
          path: probe

      # extensions/probe when the checked-out ref has it, else the repo root.
      - name: Find the probe folder
        run: echo "PROBE_DIR=$(node platform/scripts/probe-dir.mjs "$PWD/probe")" >> "$GITHUB_ENV"

      # The e2e repo is private; the org PAT_TOKEN reads it. Dependabot runs get no secrets.
      - name: Checkout the e2e repo
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          ref: ${{ steps.e2e-ref.outputs.branch }}
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      # The tarballs sit in the probe folder and the lock points at them, so the server images build from the candidate.
      - name: Pack the candidate kit, widget and app, install them in probe
        run: |
          npm ci --prefix platform
          npm run build --prefix platform
          npm pack --workspaces --prefix platform --pack-destination "$PROBE_DIR"
          cd "$PROBE_DIR"
          # No npm ci first: a probe that already pins the candidate version cannot fetch it from npm.
          # Any other workspace package the probe names (identity) comes from this tree too, never npm.
          tarballs=(./agentage-extension-*.tgz ./agentage-widget-*.tgz)
          for tgz in ./agentage-*.tgz; do
            name="@agentage/$(basename "$tgz" | sed -E 's/^agentage-(.*)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/\1/')"
            case "$name" in @agentage/extension | @agentage/widget) continue ;; esac
            if jq -e --arg n "$name" '(.dependencies // {}) + (.devDependencies // {}) | has($n)' package.json >/dev/null; then
              tarballs+=("$tgz")
            fi
          done
          npm install --no-audit --no-fund "${tarballs[@]}"
          # Permanent: the probe's own range refuses every new kit minor; the gate proves the candidate runs the probe.
          npm pkg set engines.agentage=">=0.6"
          grep -E "\"@agentage/(extension|widget)\": \"file:" package.json
          grep -cE "\"resolved\": \"file:agentage-(extension|widget)-" package-lock.json
          npm run build

      - name: agentage extension up
        working-directory: ${{ env.PROBE_DIR }}
        # The kit's own tool, not the agentage bin: the probe's @agentage/cli bundles the released kit.
        run: node node_modules/@agentage/extension/dist/tool/cli.js up

      - name: e2e gate on docker (the e2e repo, probe gate docker)
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        run: |
          npm ci
          # The gate validates the discovery document and the record with the kit under test.
          npm install --no-save "$PROBE_DIR"/agentage-extension-*.tgz
          # The version alone cannot tell the candidate from npm (both can be 0.13.0): the source can.
          resolved=$(jq -r '.packages["node_modules/@agentage/extension"].resolved' node_modules/.package-lock.json)
          echo "e2e validates with @agentage/extension $(jq -r .version node_modules/@agentage/extension/package.json) from $resolved"
          case "$resolved" in file:*) ;; *) echo "::error::the e2e kit is $resolved, not the candidate"; exit 1 ;; esac
          npx playwright install chromium
          npm run e2e -- probe gate docker

      # A gate that skipped itself is not green.
      - name: Assert the gate was not vacuous
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          MIN_EXECUTED: '30'
        run: node scripts/assert-executed.mjs

      - name: agentage extension down
        if: always()
        working-directory: ${{ env.PROBE_DIR }}
        run: node node_modules/@agentage/extension/dist/tool/cli.js down || true

  # template/ is the start of every new extension, with its own lockfile (not a workspace).
  template-changes:
    name: Template changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.pick.outputs.run }}
      candidate: ${{ steps.pick.outputs.candidate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # template/** or this file: the template on its lockfile kit. A kit package it imports: on the candidate kit.
      - name: Pick what this change touches
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          files=''
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          own=false; kit=false
          if [ -z "$files" ] || grep -qE '^(template/|\.github/workflows/ci\.yml$)' <<<"$files"; then own=true; fi
          if [ -z "$files" ] || grep -qE '^packages/(extension|widget|logs|app)/' <<<"$files"; then kit=true; fi
          run=$([ "$own" = true ] || [ "$kit" = true ] && echo true || echo false)
          echo "template: $own, kit: $kit" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "candidate=$kit" >> "$GITHUB_OUTPUT"

  template-verify:
    name: Template verify and check
    needs: template-changes
    if: needs.template-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANDIDATE: ${{ needs.template-changes.outputs.candidate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: template/package-lock.json

      # The root install goes before the template's: a root node_modules would hide a missing template dependency.
      - name: The candidate kit and widget, packed into template/.kit
        if: env.CANDIDATE == 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund && npm run build
          mkdir -p template/.kit
          npm pack -w @agentage/extension -w @agentage/widget --pack-destination template/.kit
          rm -rf node_modules packages/*/node_modules

      - name: Install (the template's own lockfile; the candidate on top when the kit changed)
        working-directory: template
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          if [ "$CANDIDATE" = true ]; then
            npm install --no-audit --no-fund ./.kit/agentage-*.tgz
            npm pkg set engines.agentage=">=0.6"
          fi

      # create rewrites the word template to the id only: a kit repo URL or a directory would break npm provenance.
      - name: package.json is private and names no kit repo
        working-directory: template
        run: jq -e '.private == true and (.repository.url | test("agentage/(platform|kit)") | not) and (.repository.directory == null) and (.bugs.url | test("agentage/(platform|kit)") | not)' package.json

      - name: Verify (type-check, lint, format, test with coverage, build)
        working-directory: template
        run: npm run verify

      # On the candidate, the kit's own check: the cli bundles the released kit and its rules.
      - name: Conformance (the kit's six rules; the store rule uses the runner's docker)
        working-directory: template
        run: |
          if [ "$CANDIDATE" = true ]; then node "$GITHUB_WORKSPACE/scripts/check-candidate.mjs"
          else node_modules/.bin/agentage extension check; fi

  template-local:
    name: Template up and the e2e gate on local
    needs: template-changes
    if: needs.template-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # The gate on docker stays under 10 minutes; the candidate build adds about 2.
    timeout-minutes: 15
    env:
      CANDIDATE: ${{ needs.template-changes.outputs.candidate }}
      SECRETS_OK: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: template/package-lock.json

      - name: The candidate kit and widget, packed into template/.kit
        if: env.CANDIDATE == 'true'
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund && npm run build
          mkdir -p template/.kit
          npm pack -w @agentage/extension -w @agentage/widget --pack-destination template/.kit
          rm -rf node_modules packages/*/node_modules

      - name: Install (and Chromium for the widget test; the runner has its OS libraries)
        working-directory: template
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          if [ "$CANDIDATE" = true ]; then
            npm install --no-audit --no-fund ./.kit/agentage-*.tgz
            npm pkg set engines.agentage=">=0.6"
          fi
          npx playwright install chromium

      # The e2e repo is private (the org PAT_TOKEN reads it); Dependabot and fork runs get no secrets.
      - name: Checkout the e2e repo
        if: env.SECRETS_OK == 'true'
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Install the e2e repo (the candidate kit validates when the kit changed)
        if: env.SECRETS_OK == 'true'
        working-directory: e2e-suite
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          if [ "$CANDIDATE" = true ]; then npm install --no-save ../template/.kit/agentage-extension-*.tgz; fi
          npx playwright install chromium

      # The lockfile cli as in a created repo; on the candidate, the kit's own tool (the cli bundles the released kit).
      - name: agentage extension up --docker (the release recipes, store, dev issuer, gateway)
        working-directory: template
        run: |
          if [ "$CANDIDATE" = true ]; then node node_modules/@agentage/extension/dist/tool/cli.js up
          else node_modules/.bin/agentage extension up --docker; fi

      - name: The widget a11y test through the local gateway (src/**/*.spec.ts)
        working-directory: template
        run: npm run test:e2e

      - name: e2e gate on docker (the e2e repo, the template row)
        if: env.SECRETS_OK == 'true'
        working-directory: e2e-suite
        run: env "TEMPLATE_DIR=$GITHUB_WORKSPACE/template" npm run e2e -- template gate docker

      # A gate that skipped itself is not green.
      - name: Assert the gate was not vacuous
        if: env.SECRETS_OK == 'true'
        working-directory: e2e-suite
        env:
          MIN_EXECUTED: '25'
        run: node scripts/assert-executed.mjs

      - name: Logs on failure
        if: failure() || cancelled()
        working-directory: template
        run: docker compose -f .agentage/compose.json logs --no-color --tail 80 || true

  # The real `agentage extension create` on this change's template/ folder, then verify in the created folder.
  template-create:
    name: Template create (${{ matrix.case }})
    needs: template-changes
    if: needs.template-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { case: short id, id: ab, parts: '' }
          - { case: long id, id: a-very-long-extension-id, parts: '' }
          - { case: api part only, id: demo, parts: api }
          - { case: app and api, id: demo, parts: app api }
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # --no-install: without it create would build the folder and give it to a local daemon.
      - name: agentage extension create from this change's template/
        env:
          ID: ${{ matrix.id }}
          PARTS: ${{ matrix.parts }}
          REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/made" && cd "$RUNNER_TEMP/made"
          npx -y @agentage/cli@0.76.0 extension create "$ID" $PARTS --from "$REPO#$REF:template" --yes --no-install

      - name: Install, commit (build needs a clean git tree) and verify
        working-directory: ${{ runner.temp }}/made/extension-${{ matrix.id }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          git init -q -b master && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm init
          npm run verify

  # The one context for the template: green when its jobs passed or this change did not touch it.
  template:
    name: Template
    needs: [template-changes, template-verify, template-local, template-create]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every template job passed or had nothing to test
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '.["template-changes"].result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
