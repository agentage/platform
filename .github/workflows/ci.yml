name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # The gate stays under 10 minutes (about 3 on 2026-11-07); slower is a regression.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: A version bump needs a change in that package
        if: github.event_name == 'pull_request'
        run: node scripts/check-bumps.mjs origin/${{ github.base_ref }}

      - name: Verify (type-check, lint, format, test with coverage, build)
        run: npm run verify

      - name: Pack smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/pack
          npm pack -w @agentage/extension --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-extension-*.tgz > /tmp/pack/files.txt
          grep -qx 'package/dist/tool/cli.js' /tmp/pack/files.txt
          grep -qx 'package/dist/runtime/main.js' /tmp/pack/files.txt
          grep -qx 'package/schemas/extension-discovery.schema.json' /tmp/pack/files.txt
          grep -qx 'package/dist/store/migrate.js' /tmp/pack/files.txt
          grep -qx 'package/dist/tool/up/dev-issuer.js' /tmp/pack/files.txt
          if grep -q '\.test\.' /tmp/pack/files.txt; then echo 'test files in the tarball'; exit 1; fi
          node packages/extension/dist/tool/cli.js --help

      - name: Pack smoke - widget (bin and harness in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/widget --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-widget-*.tgz > /tmp/pack/widget-files.txt
          grep -qx 'package/dist/bundle/cli.js' /tmp/pack/widget-files.txt
          grep -qx 'package/dist/ds/styles.generated.js' /tmp/pack/widget-files.txt
          grep -qx 'package/harness/harness.html' /tmp/pack/widget-files.txt
          if grep -Eq '\.test\.|test-support|/e2e/' /tmp/pack/widget-files.txt; then echo 'test files in the widget tarball'; exit 1; fi
          node packages/widget/dist/bundle/cli.js --help

      - name: Pack smoke - identity (dist in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/identity --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-identity-*.tgz > /tmp/pack/identity-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/identity-files.txt
          if grep -Eq '\.test\.' /tmp/pack/identity-files.txt; then echo 'test files in the identity tarball'; exit 1; fi

      - name: Pack smoke - shell (dist in, tests out)
        run: |
          set -euo pipefail
          npm pack -w @agentage/shell --pack-destination /tmp/pack
          tar -tzf /tmp/pack/agentage-shell-*.tgz > /tmp/pack/shell-files.txt
          grep -qx 'package/dist/index.js' /tmp/pack/shell-files.txt
          grep -qx 'package/dist/mount-widgets.js' /tmp/pack/shell-files.txt
          if grep -Eq '\.test\.|test-support' /tmp/pack/shell-files.txt; then echo 'test files in the shell tarball'; exit 1; fi

      - name: Image smoke - extension-probe on this kit, every part through up
        run: |
          set -euo pipefail
          npm pack --workspaces --pack-destination /tmp/pack >/dev/null
          # A PR runs against the extension-probe branch of the same name when one exists, else master.
          probe=https://github.com/agentage/extension-probe.git
          branch=master
          if [ -n "${GITHUB_HEAD_REF:-}" ] && git ls-remote --exit-code --heads "$probe" "$GITHUB_HEAD_REF" >/dev/null; then
            branch="$GITHUB_HEAD_REF"
          fi
          echo "extension-probe branch: $branch" >> "$GITHUB_STEP_SUMMARY"
          git clone --depth 1 --branch "$branch" "$probe" /tmp/probe
          mkdir -p /tmp/probe/.kit
          cd /tmp/probe
          # The probe's @agentage/* dependencies built here replace the registry copies.
          tarballs=()
          for tgz in /tmp/pack/agentage-*.tgz; do
            name="@agentage/$(basename "$tgz" | sed -E 's/^agentage-(.*)-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/\1/')"
            if jq -e --arg n "$name" '(.dependencies // {}) + (.devDependencies // {}) | has($n)' package.json >/dev/null; then
              cp "$tgz" .kit/ && tarballs+=("./.kit/$(basename "$tgz")")
            fi
          done
          npm install --no-audit --no-fund "${tarballs[@]}"
          # The smoke proves the runtime, not probe's pin: a kit minor bump must not wait on a probe release.
          pin="^$(jq -r .version node_modules/@agentage/extension/package.json | cut -d. -f1,2)"
          was=$(jq -r .engines.agentage package.json)
          if [ "$was" != "$pin" ]; then echo "::warning::probe pin stale: engines.agentage $was, smoke runs it as $pin"; fi
          jq --arg r "$pin" '.engines.agentage = $r' package.json > /tmp/pkg.json && cp /tmp/pkg.json package.json
          node node_modules/@agentage/extension/dist/tool/cli.js up

      - name: Image smoke - discovery is valid through the gateway, e2e (up already asserted each part's /health commit)
        working-directory: /tmp/probe
        run: |
          set -euo pipefail
          curl -sf http://localhost:4280/.well-known/agentage-extension.json > /tmp/discovery.json
          node --input-type=module -e "import { DiscoveryDocumentSchema } from '@agentage/extension'; import { readFileSync } from 'node:fs'; DiscoveryDocumentSchema.parse(JSON.parse(readFileSync('/tmp/discovery.json', 'utf8'))); console.log('PASS discovery valid')"
          npx playwright install chromium
          npm run test:e2e

      - name: Container logs on failure
        if: failure()
        run: docker compose -f /tmp/probe/.agentage/compose.json logs --no-color --tail 80 || true

  widget-screenshots:
    name: Widget screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Harness, echo widget and light and dark screenshots (Chromium)
        run: npm run test:e2e

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: widget-playwright-report
          path: |
            packages/widget/playwright-report
            packages/widget/test-results
          retention-days: 7

  probe-local-gate:
    name: Probe local gate on this kit
    needs: verify
    if: github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: platform

      - name: Checkout agentage/extension-probe
        uses: actions/checkout@v7
        with:
          repository: agentage/extension-probe
          path: probe

      # agentage/e2e is private; the org PAT_TOKEN reads it. Dependabot runs get no secrets.
      - name: Checkout agentage/e2e
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7
        with:
          repository: agentage/e2e
          path: e2e-suite
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      # The tarballs sit in the probe folder and the lock points at them, so the server images build from the candidate.
      - name: Pack the candidate kit and widget, install them in probe
        run: |
          npm ci --prefix platform
          npm run build --prefix platform
          npm pack --workspaces --prefix platform --pack-destination "$PWD/probe"
          cd probe
          npm ci
          npm install ./agentage-extension-*.tgz ./agentage-widget-*.tgz
          # The gate proves the candidate runs the probe; the probe widens its own range after the release.
          npm pkg set engines.agentage=">=0.6"
          grep -E "\"@agentage/(extension|widget)\": \"file:" package.json
          grep -cE "\"resolved\": \"file:agentage-(extension|widget)-" package-lock.json
          npm run build

      - name: agentage extension up
        working-directory: probe
        run: node_modules/.bin/agentage extension up

      - name: e2e gate on local (agentage/e2e, probe gate local)
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          PROBE_DIR: ${{ github.workspace }}/probe
        run: |
          npm ci
          npx playwright install chromium
          npm run e2e -- probe gate local

      # A gate that skipped itself is not green.
      - name: Assert the gate was not vacuous
        if: github.actor != 'dependabot[bot]'
        working-directory: e2e-suite
        env:
          MIN_EXECUTED: '30'
        run: node scripts/assert-executed.mjs

      - name: agentage extension down
        if: always()
        working-directory: probe
        run: node_modules/.bin/agentage extension down || true
